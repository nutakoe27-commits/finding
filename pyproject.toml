[project]
# Имя дистрибутива НЕ "gtm": на PyPI такое имя занято заброшенным пакетом,
# и `pip install gtm` тянет его вместо нашего проекта — с невнятной ошибкой
# про distribute_setup. Модуль и команда при этом остались gtm, менять их
# незачем: коллизия только в имени дистрибутива.
name = "soyuz-gtm"
version = "0.1.0"
description = "Система поиска клиентов для конференц-площадки: сигналы -> ожидания -> письма"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "rapidfuzz>=3.6",
    "python-dateutil>=2.9",
    "structlog>=24.1",
    "jinja2>=3.1",
    "tenacity>=8.2",
    "APScheduler>=3.10",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
llm = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "freezegun>=1.5",
    "respx>=0.21",
]

[project.scripts]
gtm = "gtm.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gtm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
