# Настройки коллекторов.
#
# mode:
#   live    — ходим в реальный API (нужен ключ из окружения)
#   offline — читаем фикстуры из data/fixtures, ничего не тратим
#   off     — коллектор отключён
#
# Порядок включения соответствует этапам реализации: manual работает
# с первого дня, остальные подключаются по мере готовности.

manual:
  mode: live
  enabled: true
  # Импорт CSV — не выкидывать никогда. Это и старт системы, и запасной
  # путь, когда источник сломался, и способ добавить то, что нашли руками.
  default_path: "data/manual/companies.csv"

hh:
  # ВЫКЛЮЧЕН: публичный API hh.ru закрыт. Код коллектора оставлен намеренно —
  # он написан и покрыт тестами, а структура у всех job-board API одинаковая:
  # под SuperJob или Habr Career переписывается один метод collect.
  # Парсер HTML-страниц hh делать не стоит — ломается на каждом релизе вёрстки
  # и прямо против их правил.
  mode: "off"
  enabled: false
  base_url: "https://api.hh.ru"
  area: 1               # Москва
  per_page: 100
  max_pages: 10
  rate_limit_rps: 3
  search_period_days: 30
  cost_rub_per_call: 0.0

venue_pages:
  # ГЛАВНЫЙ БЕСПЛАТНЫЙ ИСТОЧНИК. Страницы «прошедшие мероприятия» и «наши
  # клиенты» у крупных московских залов — готовый список компаний, проводивших
  # большие события в Москве. Отсюда берётся самый сильный сигнал системы.
  # Список площадок и правила обхода — в config/venues.yaml.
  mode: live
  enabled: true
  cost_rub_per_call: 0.0

fns_open_data:
  # Бесплатные наборы ФНС: универсум компаний и их размер. Приходят файлами,
  # поэтому здесь только пути — скачивать надо руками (или отдельным cron):
  #   msp       — rmsp.nalog.gov.ru, обновляется ежемесячно
  #   headcount — сведения о среднесписочной численности, nalog.gov.ru
  #   revenue   — ГИР БО, bo.nalog.gov.ru
  #
  # ВАЖНО. Имена полей в наборах меняются между выпусками, а разметка ниже —
  # предположение, не проверенный факт. Сверить и поправить:
  #   gtm inspect data/private/msp.zip
  mode: live
  enabled: true
  cost_rub_per_call: 0.0
  # Тег, внутри которого лежит одна запись. Если inspect показывает другой —
  # допишите сюда, менять код не нужно.
  record_tags: ["Документ", "Document", "row", "item"]
  msp:
    # Скачанный набор кладите сюда. Пока его нет, работает демонстрационный
    # из data/fixtures/msp — на нём видно весь конвейер без единой загрузки.
    path: "data/fixtures/msp/msp-example.xml"
    # Микропредприятия отсекаем на входе: зал на 250+ человек им не нужен,
    # а объём набора они раздувают в разы.
    skip_micro: true
    fields:
      inn: ["ИННЮЛ", "ИНН", "inn"]
      ogrn: ["ОГРН", "ogrn"]
      name: ["НаимОрганизации", "НаимОрг", "НаимПолнЮЛ", "НаимСокрЮЛ", "name"]
      category: ["КатСубМСП", "category"]
      okved: ["КодОКВЭД", "okved"]
      region: ["КодРегион", "region"]
      city: ["Город", "НаимГород", "city"]
      included_at: ["ДатаВклМСП", "included_at"]
  headcount:
    path: "data/private/headcount.zip"
    fields:
      inn: ["ИНН", "inn", "ИННЮЛ"]
      headcount: ["Численность", "СЧР", "headcount", "value"]
      year: ["Год", "year", "Период"]
  revenue:
    path: "data/private/revenue.zip"
    fields:
      inn: ["ИНН", "inn"]
      # 2110 — код строки «Выручка» в РСБУ.
      revenue: ["2110", "Выручка", "revenue", "value"]
      year: ["Год", "year", "period"]

registry:
  # Платный реестр: точная дата регистрации, штат и выручка поштучно.
  # Не обязателен — год регистрации бесплатно берётся из ОГРН
  # (см. gtm/resolve/ogrn.py), а размер — из наборов fns_open_data.
  # Включать, когда понадобится точность или компании вне реестра МСП.
  mode: "off"
  enabled: false
  provider: dadata      # dadata | damia | ofdata
  rate_limit_rps: 5
  cost_rub_per_call: 0.3
  # Кэш обязателен: одна и та же компания запрашивается многократно.
  cache_ttl_days: 90
  fixtures_path: "data/fixtures/registry"

events_archive:
  # Архивы прошедших мероприятий — основа сигнала «годовщина мероприятия».
  # Разовая тяжёлая работа по сбору за 2-3 года, дальше почти бесплатно.
  mode: offline
  enabled: true
  providers:
    timepad:
      base_url: "https://api.timepad.ru/v1"
      # Токен не обязателен для публичных выборок, но с ним выше лимиты.
      requires_token: false
      cities: ["Москва"]
      min_attendees: 200
    expomap:
      base_url: "https://expomap.ru"
      mode: "off"   # парсинг, требует отдельной аккуратности
  backfill_years: 3
  fixtures_path: "data/fixtures/events"
  cost_rub_per_call: 0.0

zakupki:
  # Откладываем в самый конец: прямой доступ к ЕИС с 2025 года требует
  # токена или ЭЦП, есть посреднические API с пробными лимитами.
  mode: "off"
  enabled: false
  provider: damia
  laws: ["44", "223"]
  keywords:
    - "аренда помещения для проведения конференции"
    - "организация форума"
    - "аренда конференц-зала"
    - "проведение конгресса"
  region: "77"
  cost_rub_per_call: 2.0

# Общие ограничения для всех коллекторов.
defaults:
  timeout_seconds: 30
  retries: 3
  retry_backoff_seconds: 2
  user_agent: "gtm-research/0.1"
