# Критерии отбора. Меняются часто — поэтому здесь, а не в коде.
#
# Главный принцип: охотимся за крупными мероприятиями. На 100-150 человек
# площадка конкурирует с несколькими сотнями московских залов и проигрывает
# по локации (ЮВАО, не центр). На 800-1500 конкурентов десятки, и туда же
# подтягиваются реальные преимущества: вход из МЦК Дубровка прямо в ТРЦ,
# парковка торгового центра, ТТК рядом.
#
# Малый зал (150) и ресторан (104) продаём входящим, система на них не тратится.

venue:
  name: "Союз Холл"
  city: "Москва"
  district: "ЮВАО"
  area_sqm: 2300
  halls:
    big_hall:
      capacity_max: 1500
      capacity_theatre: 1000
      is_target: true
    small_hall:
      capacity_max: 150
      is_target: false   # входящие, без системы
    restaurant:
      capacity_max: 104
      is_target: false
  advantages:
    - "прямой вход из МЦК Дубровка в ТРЦ"
    - "шаговая доступность метро"
    - "парковка торгового центра"
    - "ТТК рядом — логистика для иногородних участников"

# Масштаб мероприятия — ключевой критерий. Если в прошлом году было
# на 80 человек, это не наш клиент, даже если компания крупная.
scale:
  min_attendees: 250
  target_attendees_min: 400
  target_attendees_max: 1500
  # Выше этого мы физически не вмещаем — такие ожидания отсекаем.
  hard_max_attendees: 1500
  # Когда число участников неизвестно, оцениваем по штату компании.
  attendees_from_headcount_ratio: 0.6

geo:
  # Регионы регистрации компании, которые нас интересуют.
  company_regions: ["77", "50"]
  # Компания из другого региона подходит, если её мероприятие в Москве.
  allow_any_region_if_event_in_moscow: true
  event_cities: ["Москва", "Moscow", "Москва и МО"]

company:
  min_headcount: 100
  # Выручка ниже — бюджета на зал такого масштаба обычно нет.
  min_revenue_rub: 300000000
  allowed_statuses: ["active"]
  # Отсекаем компании, зарегистрированные меньше года назад:
  # у них не бывает годовщин мероприятий.
  min_age_years: 1

exclude:
  # Конкуренты и смежники — площадки, event-агентства как прямые адресаты
  # (с агентствами работаем отдельным каналом, не холодными письмами).
  okved_prefixes:
    - "68."     # операции с недвижимостью
    - "93.29"   # деятельность зрелищно-развлекательная прочая
  name_patterns:
    - "(?i)крокус"
    - "(?i)экспоцентр"
    - "(?i)конференц-зал"
    - "(?i)ивент[- ]агентств"

# Причины отсева, которые фильтр возвращает в filter_verdict.
# Ничего не выбрасывается тихо: у каждого отсева есть код.
reject_codes:
  too_small: "мероприятие меньше min_attendees"
  too_big: "не вмещаем"
  wrong_geo: "ни компания, ни мероприятие не в Москве"
  too_small_company: "штат/выручка ниже порога"
  suppressed: "в стоп-листе"
  excluded_industry: "исключённая отрасль"
  no_contact: "нет контакта для письма"
  window_closed: "окно контакта уже закрылось"
