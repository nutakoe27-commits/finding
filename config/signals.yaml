# Типы сигналов, веса и окна контакта.
#
# Главное правило: сигнал должен срабатывать ДО того, как решение о площадке
# принято. Когда конференцию анонсировали публично, площадка забронирована
# два-четыре месяца назад — вы приходите к закрытой двери.
#
# lead_days — за сколько дней до ожидаемой даты открывается окно контакта.
# window_days — сколько дней окно остаётся открытым.

kinds:
  # Самый сильный сигнал. Компания провела конференцию в ноябре прошлого
  # года — с высокой вероятностью проведёт и в этом. Пишем в июле.
  event_anniversary:
    enabled: true
    weight: 1.0
    lead_days: 120
    window_days: 60
    base_confidence: 0.7
    # Уверенность растёт, если мероприятие повторялось несколько лет.
    confidence_per_repeat: 0.1
    max_confidence: 0.95

  # Конкурентов на этом сигнале практически нет, потому что никто им
  # не пользуется. Дата регистрации юрлица есть в ЕГРЮЛ по ИНН.
  company_jubilee:
    enabled: true
    weight: 0.8
    lead_days: 150
    window_days: 75
    base_confidence: 0.45
    round_years: [5, 10, 15, 20, 25, 30, 35, 40, 50]
    # Для 10/25/50 уверенность выше — такие отмечают почти всегда.
    major_years: [10, 25, 50]
    major_confidence_bonus: 0.15

  # Структурированный публичный источник, показывает намерение до проведения.
  # Оговорка: госзаказчик обязан проводить конкурс — это не «письмо и договор»,
  # а участие в процедуре. Клиенту разницу нужно объяснить.
  tender:
    enabled: false   # включаем последним: возня с токенами/платным посредником
    weight: 0.9
    lead_days: 30
    window_days: 30
    base_confidence: 0.8

  # Компания строит событийную функцию — значит, события будут.
  # ВЫКЛЮЧЕН вместе с коллектором hh: источника, который кормил бы этот тип,
  # больше нет. Включать обратно только вместе с заменой источника вакансий,
  # иначе движок будет ждать фактов, которых не будет.
  vacancy_signal:
    enabled: false
    weight: 0.5
    lead_days: 90
    window_days: 90
    base_confidence: 0.35
    keywords:
      - "event-менеджер"
      - "ивент-менеджер"
      - "менеджер по организации мероприятий"
      - "руководитель отдела внутренних коммуникаций"
      - "менеджер по корпоративным мероприятиям"
      - "event manager"

  # Редкий, но золотой: закрылась известная площадка — все её постоянные
  # клиенты в этом сезоне без зала.
  venue_loss:
    enabled: false   # ловится вручную по новостям и телеграм-каналам
    weight: 1.0
    lead_days: 60
    window_days: 90
    base_confidence: 0.6

  # Рост штата, новый офис, инвестиции. Слабее остальных, но добавляет
  # в скоринг: компания переросла площадку, где праздновала в прошлом году.
  growth:
    enabled: true
    weight: 0.3
    lead_days: 120
    window_days: 90
    base_confidence: 0.2

  manual:
    enabled: true
    weight: 0.7
    lead_days: 120
    window_days: 120
    base_confidence: 0.6

# Сезонность. Корпоративный сезон — самая денежная история для московских
# площадок — бронируется с августа по октябрь. Ожидания на декабрь получают
# множитель, потому что цикл продажи там короче и денег больше.
seasonality:
  month_multiplier:
    "1": 0.7
    "2": 0.9
    "3": 1.0
    "4": 1.0
    "5": 0.8
    "6": 0.7
    "7": 0.6
    "8": 0.9
    "9": 1.1
    "10": 1.15
    "11": 1.2
    "12": 1.3

scoring:
  # score = weight * confidence * seasonality * (1 + sum(bonuses))
  bonuses:
    attendees_over_500: 0.30
    attendees_over_800: 0.50
    moscow_hq: 0.20
    previous_venue_known: 0.15
    contact_is_event_manager: 0.25
    repeat_event: 0.20
  penalties:
    attendees_unknown: 0.20
    contact_generic_email: 0.15
  min_score_to_deliver: 0.25

# Веса пересчитываются по накопленным исходам (gtm feedback recalibrate).
# До накопления минимума данных пересчёт не запускается — иначе система
# переобучится на трёх письмах.
calibration:
  min_outcomes_per_kind: 25
  max_weight_shift: 0.25
  positive_outcomes: ["reply_positive", "meeting", "viewing", "booked"]
