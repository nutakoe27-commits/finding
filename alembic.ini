# Миграции схемы.
#
# URL здесь намеренно не задан: его отдаёт gtm.settings (GTM_DATABASE_URL),
# чтобы у приложения и у alembic был один источник правды и они не разъехались.
# Логирование тоже не настраиваем — в проекте structlog, дублировать конфиг
# логгеров в ini незачем.

[alembic]
# %(here)s — каталог этого файла: alembic находит миграции из любого cwd.
script_location = %(here)s/gtm/storage/migrations
prepend_sys_path = %(here)s
# Имя файла = ревизия + слаг. Ревизии задаём вручную по порядку
# (alembic revision --autogenerate -m "add foo" --rev-id 0002), чтобы по
# списку файлов было видно, что за чем накатывается: у хэшей такого порядка нет.
file_template = %%(rev)s_%%(slug)s
