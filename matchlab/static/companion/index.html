<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#172b3c" />
    <title>Мира · Сообщения</title>
    <link rel="stylesheet" href="/chat-assets/chat.css?v=5" />
    <script defer src="/chat-assets/chat.js?v=5"></script>
    <script defer src="/chat-assets/voice.js?v=3"></script>
    <script defer src="/chat-assets/call.js?v=4"></script>
  </head>
  <body>
    <main class="messenger" data-pane="chat">
      <aside class="rail" aria-label="Список чатов">
        <div class="railbrand">
          <a class="wordmark" href="/" aria-label="Мира, на главную">мира<span>.</span></a>
        </div>
        <h2>Чаты</h2>
        <button class="contact" id="openChat" aria-label="Открыть чат с Мирой">
          <img src="/chat-assets/mira.webp" alt="" /><span
            ><strong>Мира</strong><small id="preview">Начать разговор</small></span
          >
          <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6" /></svg>
        </button>
        <nav class="railfoot">
          <button id="profileSide">
            <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 8a4 4 0 1 1 8 0 4 4 0 0 1-8 0 M4 21v-2a8 6 0 0 1 16 0v2" /></svg
            ><span id="profileLabel">Войти в аккаунт</span>
          </button>
          <a id="adminLink" href="/admin" hidden>Администрирование ↗</a>
          <a href="/chat-assets/rules.html"
            ><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 3h12a3 3 0 0 1 3 3v14H6a2 2 0 0 1 0-4h13 M4 4v14" /></svg
            >Условия и данные</a
          >
        </nav>
      </aside>
      <section class="conversation" aria-label="Чат с Мирой">
        <header class="chathead">
          <button class="tool" id="backChats" aria-label="К списку чатов">
            <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7" /></svg>
          </button>
          <img class="headphoto" src="/chat-assets/mira.webp" alt="" />
          <div class="contactname">
            <h1>Мира</h1>
            <small>ИИ-собеседница</small>
          </div>
          <button
            class="tool"
            id="find"
            title="Найти в переписке"
            aria-label="Найти в переписке"
            aria-expanded="false"
            aria-controls="finder"
          >
            <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.5 20.5l-5-5 M18 10.5a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0" />
            </svg>
          </button>
          <button
            class="tool"
            id="call"
            aria-pressed="false"
            title="Позвонить Мире"
            aria-label="Позвонить Мире"
          >
            <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M7 3H4a1 1 0 0 0-1 1c0 9.4 7.6 17 17 17a1 1 0 0 0 1-1v-3l-5-2-2 2a15 15 0 0 1-7-7l2-2z"
              />
            </svg>
          </button>
          <button id="profile">Войти</button>
        </header>
        <form id="finder" role="search" hidden>
          <input
            type="search"
            id="query"
            aria-label="Поиск по сообщениям"
            placeholder="Найти в переписке"
          />
          <small id="found" role="status"></small>
          <button type="button" class="tool" id="findPrev" aria-label="Предыдущее совпадение">
            <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6" /></svg>
          </button>
          <button class="tool" id="findNext" aria-label="Следующее совпадение">
            <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
          </button>
          <button type="button" class="tool" id="endFind" aria-label="Закрыть поиск">
            <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 6 12 12 M18 6 6 18" />
            </svg>
          </button>
        </form>
        <section id="thread" aria-label="Переписка">
          <div id="welcome">
            <div class="introphoto">
              <img src="/chat-assets/mira.webp" class="portrait" alt="Портрет Миры" />
              <h2>Мира<span>.</span></h2>
            </div>
            <div class="intromsg">
              <p>Привет! Как у тебя день?</p>
              <div id="starters">
                <button>
                  Есть чем поделиться
                  <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m9 6 6 6-6 6" />
                  </svg>
                </button>
                <button>
                  Давай знакомиться
                  <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m9 6 6 6-6 6" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <div id="messages" role="log" aria-live="off"></div>
        </section>
        <footer>
          <div id="status" role="status"></div>
          <div id="recording" hidden>
            <span class="recDot"></span><strong id="recTime">Запись · 0:00</strong>
            <button id="cancelRec">Отмена</button><button id="finishRec">Готово</button>
          </div>
          <form id="compose">
            <textarea
              rows="1"
              maxlength="2000"
              id="message"
              aria-label="Сообщение Мире"
              placeholder="Сообщение…"
              required
            ></textarea>
            <button
              type="button"
              class="icon"
              id="mic"
              aria-label="Продиктовать сообщение"
              title="Продиктовать сообщение"
            >
              <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 6a3 3 0 0 1 6 0v6a3 3 0 0 1-6 0z M5 11v1a7 7 0 0 0 14 0v-1 M12 19v3" />
              </svg>
            </button>
            <button class="primary icon" id="send" aria-label="Отправить" title="Отправить">
              <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m3 11 18-8-7 18-3-8z M11 13 21 3" />
              </svg>
            </button>
          </form>
          <small class="privacy"
            >Переписка доступна администратору ·
            <a href="/chat-assets/rules.html#data">Подробнее</a></small
          >
        </footer>
      </section>
    </main>
    <dialog id="callScreen" aria-labelledby="callName" aria-describedby="callState">
      <div class="callStage">
        <div class="callTop"><span>Аудиозвонок</span><time id="callTime" hidden>00:00</time></div>
        <div class="caller">
          <div class="orbit"><img src="/chat-assets/mira.webp" alt="" /></div>
          <h2 id="callName">Мира</h2>
          <p id="callState" role="status">Вызов…</p>
        </div>
        <div class="callControls">
          <button type="button" id="callMic" aria-pressed="false" disabled>
            <span class="disc"
              ><svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="9" y="2" width="6" height="13" rx="3" />
                <path d="M5 11v1a7 7 0 0 0 14 0v-1M12 19v3" />
                <path class="micSlash" d="m3 3 18 18" /></svg></span
            ><span>Микрофон</span>
          </button>
          <button type="button" id="endCall" autofocus>
            <span class="disc"
              ><svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 14c4-7 16-7 20 0l-3 3-4-2v-3a11 11 0 0 0-6 0v3l-4 2z" /></svg></span
            ><span>Завершить</span>
          </button>
          <button type="button" id="callAction" hidden>
            <span class="disc"
              ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 12 4 4 8-9" /></svg></span
            ><span id="actionLabel">Готово</span>
          </button>
        </div>
      </div>
    </dialog>
    <dialog id="sheet" aria-labelledby="sheetTitle">
      <form method="dialog"><button class="close" aria-label="Закрыть">×</button></form>
      <h2 id="sheetTitle">Войти в чат</h2>
      <div id="loginBox">
        <div id="providers"></div>
        <form id="login">
          <label>Логин<input name="username" autocomplete="username" required /></label
          ><label
            >Пароль<input
              name="password"
              type="password"
              autocomplete="current-password"
              required /></label
          ><button class="primary">Войти</button>
        </form>
        <button id="registerToggle">Создать аккаунт</button>
      </div>
      <form id="register" hidden>
        <div id="credentials">
          <label
            >Логин<input
              name="username"
              autocomplete="username"
              pattern="[a-zA-Z0-9_]{3,32}"
              placeholder="От 3 латинских букв или цифр"
              required /></label
          ><label
            >Пароль<input
              name="password"
              autocomplete="new-password"
              type="password"
              minlength="12"
              maxlength="128"
              placeholder="От 12 символов"
              required
          /></label>
        </div>
        <label class="check"
          ><input type="checkbox" required />Мне есть 18 лет. Принимаю
          <a href="/chat-assets/rules.html" target="_blank">условия чата</a>.</label
        >
        <label class="check"
          ><input type="checkbox" required />Соглашаюсь на
          <a href="/chat-assets/rules.html#data" target="_blank">обработку данных</a>.</label
        ><button id="agree" class="primary">Создать аккаунт</button>
      </form>
      <section id="account" hidden>
        <p id="identity"></p>
        <a id="adminMobile" href="/admin" hidden>Управление пользователями</a>
        <div id="payments"></div>
        <button id="clear">Удалить переписку</button><button id="logout">Выйти</button>
      </section>
      <p role="status" id="notice"></p>
    </dialog>
  </body>
</html>
