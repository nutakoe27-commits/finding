<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Мира · Личный чат</title><link rel="stylesheet" href="/chat-assets/chat.css"><script defer src="/chat-assets/chat.js"></script></head><body>
<main><header><span class="avatar" aria-hidden="true">М</span><div><h1>Мира</h1><small>Виртуальная собеседница</small></div><button id="profile">Войти</button></header>
<section id="thread" aria-label="Переписка"><div id="welcome"><span class="kicker">Первый разговор</span><h2>Привет, я Мира.</h2><p>О чём тебе хочется поговорить?</p><div id="starters"><button>Расскажу, как прошёл день</button><button>Задай мне вопрос</button></div></div><div id="messages"></div></section>
<footer><p role="status" id="status"></p><form id="compose"><textarea rows="2" maxlength="2000" id="message" aria-label="Сообщение Мире" placeholder="Написать Мире…" required></textarea><button class="primary" id="send">Отправить</button></form><small>Бесплатный чат с ИИ · <a href="/chat-assets/rules.html">Условия и данные</a></small></footer></main>
<dialog id="sheet"><form method="dialog"><button class="close" aria-label="Закрыть">×</button></form><h2 id="sheetTitle">Войти в чат</h2>
<div id="loginBox"><div id="providers"></div><form id="login"><label>Логин<input name="username" autocomplete="username" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Войти</button></form><button id="registerToggle">Создать аккаунт</button></div>
<form id="register" hidden><div id="credentials"><label>Логин<input name="username" autocomplete="username" pattern="[a-zA-Z0-9_]{3,32}" placeholder="От 3 латинских букв или цифр" required></label><label>Пароль<input name="password" autocomplete="new-password" type="password" minlength="12" maxlength="128" placeholder="От 12 символов" required></label></div>
<label class="check"><input type="checkbox" required>Мне есть 18 лет. Принимаю <a href="/chat-assets/rules.html" target="_blank">условия чата</a>.</label>
<label class="check"><input type="checkbox" required>Соглашаюсь на <a href="/chat-assets/rules.html#data" target="_blank">обработку данных</a>.</label><button id="agree" class="primary">Создать аккаунт</button></form>
<section id="account" hidden><p id="identity"></p><div id="payments"></div><button id="clear">Удалить переписку</button><button id="logout">Выйти</button></section><p role="status" id="notice"></p></dialog></body></html>
